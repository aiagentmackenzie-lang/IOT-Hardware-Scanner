name: IOT-Hardware-Scanner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  #: Pinned extraction worker. Bump together with worker/Dockerfile and the
  #: scanner's default `worker_image` setting.
  IHS_WORKER_IMAGE: ihs-squashfs-worker:4.5.1
  #: Pinned OpenWrt qualification corpus.
  IHS_REFERENCE_FILE: openwrt-24.10.0-armsr-armv8-generic-squashfs-rootfs.img.gz
  IHS_REFERENCE_SHA256: 8b5aa82659cafd90b26333dd419a0df9ad63c517ad94a2159e970a5bb5b6ff02
  IHS_REFERENCE_URL: https://downloads.openwrt.org/releases/24.10.0/targets/armsr/armv8/
  #: Frozen build declarations, verified against the publisher's sha256sums.
  IHS_MANIFEST_FILE: openwrt-24.10.0-armsr-armv8.manifest
  IHS_SBOM_FILE: openwrt-24.10.0-armsr-armv8.bom.cdx.json

jobs:
  python-gate:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Span of requires-python ">=3.10" (floor, mid, latest)
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Test with pytest (coverage gate)
        run: pytest --cov=src/iot_hardware_scanner --cov-report=term --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # Installed-wheel job. The backend is deliberately absent: no extraction tool
  # is installed, which is the exact configuration a caller gets from
  #   pip install iot-hardware-scanner
  # and the case the scanner must report honestly (exit 5, not a clean 0).
  # ---------------------------------------------------------------------------
  installed-wheel-no-backend:
    name: Installed wheel, no extraction backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          sha256sum dist/*.whl

      - name: Install outside the checkout
        run: |
          python -m venv /tmp/ihs-venv
          /tmp/ihs-venv/bin/pip install --upgrade pip
          /tmp/ihs-venv/bin/pip install dist/*.whl
          /tmp/ihs-venv/bin/pip install pytest

      - name: Audited extras
        run: |
          # Every advertised extra must resolve from the built wheel.
          # `extraction` has no installable binding and must not be advertised.
          # `sbom` is advertised again on purpose: it now carries a working
          # export path (`iot-hardware-scanner sbom --validate`).
          WHEEL=$(ls dist/*.whl)
          /tmp/ihs-venv/bin/pip install "${WHEEL}[nvd]" "${WHEEL}[yaml-support]" "${WHEEL}[sbom]"
          # Run the audited import under the environment that has the wheel
          # installed: the job's own interpreter never has the package, and
          # that is the whole point of installing outside the checkout.
          /tmp/ihs-venv/bin/python - "$WHEEL" <<'PY'
          import sys, zipfile
          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(
                  archive.read(n).decode()
                  for n in archive.namelist()
                  if n.endswith("METADATA")
              )
          extras = {
              line.split(":", 1)[1].strip().lower()
              for line in metadata.splitlines()
              if line.startswith("Provides-Extra:")
          }
          print("advertised extras:", sorted(extras))
          assert "extraction" not in extras, "the broken extraction extra is back"
          assert "sbom" in extras, "the sbom extra is missing its export path"
          assert {"nvd", "yaml-support", "sbom"} <= extras
          # The export must be able to validate: jsonschema is what the extra is
          # for, and the schema itself ships inside the wheel.
          import iot_hardware_scanner.scanner.sbom_export as export
          assert export.schema_directory().is_dir()
          assert export.VENDORED_SCHEMAS
          # The ELF reader must ship: it is the only path that reads target
          # structure, and a wheel without it silently inventories nothing.
          requires = metadata.lower()
          assert "pyelftools" in requires, "pyelftools is missing from the wheel metadata"
          PY

      - name: Acceptance harness against the installed console script
        env:
          IHS_INSTALLED_CLI: /tmp/ihs-venv/bin/iot-hardware-scanner
        run: |
          # The repository's conftest imports the package, so pytest must run
          # under the interpreter that has it installed -- not the job default.
          /tmp/ihs-venv/bin/python -m pytest tests/test_installed_cli.py -v

      - name: Blank-image contract
        run: |
          set +e
          cd /tmp && mkdir -p blank-run && cd blank-run
          head -c 4096 /dev/zero > blank.bin
          /tmp/ihs-venv/bin/iot-hardware-scanner scan blank.bin --offline \
            --format json --out requested.json
          status=$?
          set -e
          test -f requested.json || { echo "requested report was not written"; exit 1; }
          test "$status" -ne 0 || { echo "an unanalysed image exited 0"; exit 1; }
          # The expected schema comes from the installed package, not from a
          # number copied into this workflow: a duplicated constant is how this
          # gate last went stale.
          /tmp/ihs-venv/bin/python -c "
          import json, sys
          from iot_hardware_scanner.scanner.report_document import SCHEMA_VERSION
          d = json.load(open('requested.json'))
          assert d['schema_version'] == SCHEMA_VERSION, (d['schema_version'], SCHEMA_VERSION)
          assert d['assessment']['completion'] == 'INCOMPLETE'
          assert d['risk_score'] is None
          print('blank image: exit', sys.argv[1], '->', d['outcome']['exit_reason'])
          " "$status"

  # ---------------------------------------------------------------------------
  # Report-contract job: schema, replay, renderer equivalence and the v1/v2/v3
  # reader migrations.
  # ---------------------------------------------------------------------------
  report-contract:
    name: Report schema and replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Exit precedence and document contract
        run: |
          pytest tests/test_exit_contract.py tests/test_report_document.py \
                 tests/test_report_schema3.py tests/test_cli.py -v

  # ---------------------------------------------------------------------------
  # Reference-image job, backend absent. Fetches the pinned image in its own
  # step, verifies the publisher digest, and only then scans it -- the scan
  # itself stays offline. This is Milestone B row 2: the worker is off, the
  # report is useful, the dependency is named, the exit is 5.
  # Set the repository variable IHS_REFERENCE_IMAGE_ENABLED=false to skip.
  # ---------------------------------------------------------------------------
  reference-image:
    name: OpenWrt reference image (backend absent)
    runs-on: ubuntu-latest
    if: vars.IHS_REFERENCE_IMAGE_ENABLED != 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stage the pinned image
        run: |
          curl -fsSLO "$IHS_REFERENCE_URL$IHS_REFERENCE_FILE"
          echo "$IHS_REFERENCE_SHA256  $IHS_REFERENCE_FILE" | sha256sum -c -
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Qualify the reference image without a worker
        env:
          IHS_REFERENCE_IMAGE: ${{ github.workspace }}/${{ env.IHS_REFERENCE_FILE }}
        run: |
          pytest tests/test_installed_cli.py -k openwrt -v
          pytest tests/test_installed_image_cli.py -v \
            -k "WorkerOff or ReplacedBuildOutput or snapshot_stays_in_use"

  # ---------------------------------------------------------------------------
  # Bounded resource and performance job. No container runtime is needed: the
  # entropy pass streams the input, and the point is that a 2 GiB artifact is
  # measured without being pulled into memory. A skip fails the job.
  # ---------------------------------------------------------------------------
  bounded-resources:
    name: Bounded resources (2 GiB, no worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Reader and budget contracts
        run: |
          set -o pipefail
          pytest tests/test_bounded_reader.py tests/test_entropy.py \
            -v -rfs 2>&1 | tee /tmp/resources.log
      - name: No skips in the resource gate
        run: |
          test -s /tmp/resources.log || { echo "the resource run produced no log"; exit 1; }
          grep -qE "[0-9]+ passed" /tmp/resources.log || { echo "the resource run did not pass"; exit 1; }
          if grep -qE "[0-9]+ skipped" /tmp/resources.log; then
            echo "a skip leaves the resource limit case unexercised"
            exit 1
          fi
      - name: Sparse 2 GiB measurement
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import json, os, resource, subprocess, sys, time
          target = "sparse-2g.bin"
          with open(target, "wb") as handle:
              handle.truncate(2 * 1024 * 1024 * 1024)
          command = [
              sys.executable, "-m", "iot_hardware_scanner", "entropy", target,
              "--format", "json", "--block-size", "16777216",
          ]
          env = dict(os.environ, IOT_HARDWARE_SCANNER_MAX_ENTROPY_SCAN_SIZE_MB="4096")
          started = time.monotonic()
          completed = subprocess.run(command, env=env)
          elapsed = time.monotonic() - started
          usage = resource.getrusage(resource.RUSAGE_CHILDREN)
          record = {
              "bytes": os.path.getsize(target),
              "exit": completed.returncode,
              "elapsed_seconds": round(elapsed, 2),
              "peak_rss_kib": usage.ru_maxrss,
          }
          print(json.dumps(record))
          assert record["exit"] == 0, record
          # 2 GiB at 16 MiB windows: bounded memory, not one flat allocation.
          assert record["peak_rss_kib"] < 512 * 1024, record
          assert record["elapsed_seconds"] < 300, record
          PY
      - name: Publish the measurement
        run: echo "measurement recorded in the job log; the release notes quote it"

  # ---------------------------------------------------------------------------
  # MILESTONE C QUALIFIED GATE (was milestone B). This is the only job with the real extraction
  # path: a pinned worker image built here, the installed wheel, the pinned
  # corpus, and every acceptance row of the milestone. A skip in this job means
  # the capability is unqualified, so the job fails on skips.
  # ---------------------------------------------------------------------------
  linux-extractor:
    name: Linux extractor (worker image, acceptance rows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the pinned worker images and print the evidence
        run: |
          # Two stages, two images: `runtime` is what a scan uses (unsquashfs
          # only); `verification` adds binutils for the readelf cross-check and
          # is never the default target.
          docker build -t "$IHS_WORKER_IMAGE" worker/
          docker build --target verification -t "${IHS_WORKER_IMAGE}-verify" worker/
          echo "== Dockerfile sha256"
          sha256sum worker/Dockerfile
          echo "== pinned package list sha256 (runtime, verification)"
          sha256sum worker/packages.txt worker/packages-verify.txt
          echo "== installed packages, from the image itself (runtime)"
          docker run --rm --entrypoint /usr/bin/dpkg-query "$IHS_WORKER_IMAGE" \
            -W -f='${Package}=${Version}\n' | sort | tee /tmp/packages-in-image.txt | sha256sum
          diff <(grep -v '^#' worker/packages.txt) /tmp/packages-in-image.txt
          echo "== runtime image contents: unsquashfs only, no binutils"
          docker run --rm --entrypoint /usr/bin/sha256sum "$IHS_WORKER_IMAGE" /usr/bin/unsquashfs
          if docker run --rm --entrypoint /usr/bin/readelf "$IHS_WORKER_IMAGE" -v; then
            echo "binutils leaked into the runtime image"; exit 1
          fi
          echo "== observed image ids (not reproducible: the image config carries a build timestamp)"
          docker image inspect --format '{{.Id}}' "$IHS_WORKER_IMAGE"
          docker image inspect --format '{{.Id}}' "${IHS_WORKER_IMAGE}-verify"
          # `unsquashfs -version` prints its banner and exits 1 by design, so the
          # status is read through a pipe and the line is what is checked.
          docker run --rm --entrypoint /usr/bin/unsquashfs "$IHS_WORKER_IMAGE" -version \
            2>&1 | head -1
          docker run --rm --entrypoint /usr/bin/readelf "${IHS_WORKER_IMAGE}-verify" -v 2>&1 | head -1

      - name: Stage the pinned image
        run: |
          curl -fsSLO "$IHS_REFERENCE_URL$IHS_REFERENCE_FILE"
          echo "$IHS_REFERENCE_SHA256  $IHS_REFERENCE_FILE" | sha256sum -c -

      - name: Stage the frozen declarations, verified against the publisher index
        run: |
          # The declarations are fetched outside the scan, each verified against
          # the publisher's own sha256sums, then handed over by path. Fetching is
          # never part of a scan, a comparison or an export.
          curl -fsSLO "$IHS_REFERENCE_URL$IHS_MANIFEST_FILE"
          curl -fsSLO "$IHS_REFERENCE_URL$IHS_SBOM_FILE"
          curl -fsSLO "${IHS_REFERENCE_URL}sha256sums"
          grep -F " *$IHS_MANIFEST_FILE" sha256sums | sha256sum -c -
          grep -F " *$IHS_SBOM_FILE" sha256sums | sha256sum -c -
          sha256sum "$IHS_MANIFEST_FILE" "$IHS_SBOM_FILE"
          echo "IHS_REFERENCE_MANIFEST=$PWD/$IHS_MANIFEST_FILE" >> "$GITHUB_ENV"
          echo "IHS_REFERENCE_SBOM=$PWD/$IHS_SBOM_FILE" >> "$GITHUB_ENV"

      - name: Build the wheel and install it outside the checkout
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          sha256sum dist/*.whl
          python -m venv /tmp/ihs-venv
          /tmp/ihs-venv/bin/pip install --upgrade pip
          # The sbom extra is installed so the export validates offline in this
          # job, and so a missing dependency would fail here rather than skip.
          WHEEL=$(ls dist/*.whl)
          /tmp/ihs-venv/bin/pip install "${WHEEL}[sbom]"
          /tmp/ihs-venv/bin/pip install pytest

      - name: Milestone C and D acceptance rows (reference image, worker image)
        env:
          IHS_INSTALLED_CLI: /tmp/ihs-venv/bin/iot-hardware-scanner
          IHS_REFERENCE_IMAGE: ${{ github.workspace }}/${{ env.IHS_REFERENCE_FILE }}
        run: |
          # `-rfs` lists every skip reason. In this job a skip means the
          # capability is unqualified, so the next step fails the gate on it.
          set -o pipefail
          # Every module that carries a release-gate row runs here, against the
          # wheel installed outside the checkout. A skip in this job leaves that
          # capability unqualified, and the next step fails on it.
          /tmp/ihs-venv/bin/python -m pytest \
            tests/test_installed_image_cli.py \
            tests/test_comparison.py \
            tests/test_sbom.py \
            tests/test_elf_parser.py \
            tests/test_rule_semantics.py \
            tests/test_control_matrix.py \
            tests/test_advisory.py \
            tests/test_invariance.py \
            -v -rfs 2>&1 | tee /tmp/gate.log

      - name: Document types, from the installed wheel
        env:
          IHS_REFERENCE_IMAGE: ${{ github.workspace }}/${{ env.IHS_REFERENCE_FILE }}
        run: |
          # No schema, stage or version literal is written here: each one is
          # imported from the package under test, because a duplicated constant
          # is how a gate goes stale (run 44863090126).
          /tmp/ihs-venv/bin/python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path

          from iot_hardware_scanner import __version__
          from iot_hardware_scanner.scanner.comparison import COMPARISON_SCHEMA
          from iot_hardware_scanner.scanner.report_document import SCHEMA_VERSION
          from iot_hardware_scanner.scanner.sbom_export import CYCLONEDX_SPEC_VERSION

          work = Path(tempfile.mkdtemp(dir=os.environ.get("RUNNER_TEMP", "/tmp")))
          image = Path(os.environ["IHS_REFERENCE_IMAGE"])
          report = work / "scan.json"
          scan = subprocess.run(
              [sys.executable, "-m", "iot_hardware_scanner", "scan", str(image),
               "--offline", "--format", "json", "--out", str(report)],
              capture_output=True, text=True,
          )
          document = json.loads(report.read_text())
          assert document["schema_version"] == SCHEMA_VERSION, document["schema_version"]
          assert len(document["components"]) == 196, len(document["components"])
          assert document["component_bases"]["total"] == 196

          comparison = work / "comparison.json"
          compared = subprocess.run(
              [sys.executable, "-m", "iot_hardware_scanner", "compare",
               str(report), str(report),
               "--declaration", os.environ["IHS_REFERENCE_MANIFEST"],
               "--declaration", os.environ["IHS_REFERENCE_SBOM"],
               "--format", "json", "--out", str(comparison)],
              capture_output=True, text=True,
          )
          compare_document = json.loads(comparison.read_text())
          assert compare_document["schema_version"] == COMPARISON_SCHEMA
          assert compare_document["packages"]["base_names"] == 196
          outcomes = {
              entry["kind"]: entry
              for entry in compare_document["declarations"]
          }
          manifest_entry = outcomes["openwrt-target-manifest"]
          assert manifest_entry["scope"]["declared_rows"] == 124
          assert manifest_entry["outcomes"]["observed-only"] == 72

          bom_path = work / "bom.cdx.json"
          exported = subprocess.run(
              [sys.executable, "-m", "iot_hardware_scanner", "sbom", str(report),
               "--out", str(bom_path), "--validate"],
              capture_output=True, text=True,
          )
          assert exported.returncode == 0, exported.stdout + exported.stderr
          bom = json.loads(bom_path.read_text())
          assert bom["specVersion"] == CYCLONEDX_SPEC_VERSION
          assert len(bom["components"]) == 196
          print(
              f"version {__version__}; scan schema {SCHEMA_VERSION}; "
              f"comparison {COMPARISON_SCHEMA}; bom {bom['specVersion']}; "
              f"compare exit {compared.returncode}"
          )
          PY

      - name: No skips in the qualified gate
        if: always()
        run: |
          test -s /tmp/gate.log || { echo "the acceptance run produced no log"; exit 1; }
          grep -qE "[0-9]+ passed" /tmp/gate.log || { echo "the acceptance run did not pass"; exit 1; }
          if grep -qE "[0-9]+ skipped" /tmp/gate.log; then
            echo "a skip leaves that capability unqualified; the release gate fails"
            grep -E "SKIPPED|skipped" /tmp/gate.log || true
            exit 1
          fi
