[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-hardware-scanner"
version = "2.6.0"
description = "Defensive firmware security analysis platform for IoT/embedded/OT devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lead Security Engineer" },
]
keywords = ["iot", "firmware", "security", "scanner", "vulnerability", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "python-magic>=0.4",
    "rich>=13.0",
    "jinja2>=3.1",
    "yara-python>=4.5",
    "pyelftools>=0.30",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# NOTE: no `extraction` extra. No installable release of the Python binwalk
# binding provides the API this scanner needs, so advertising one produced a
# resolver failure. Firmware image extraction is unavailable in this release
# and the CLI says so explicitly.
nvd = ["nvdlib>=0.7"]
# `sbom` is real: `iot-hardware-scanner sbom --validate` checks the exported
# CycloneDX 1.6 BOM against the schema vendored inside the wheel.
sbom = ["jsonschema>=4.18"]
yaml_support = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
iot-hardware-scanner = "iot_hardware_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_hardware_scanner"]
# Rules and bundled data must travel with the wheel: an installed scanner
# outside a source checkout loads them from the package itself.
artifacts = [
    "src/iot_hardware_scanner/yara/rules/**/*.yar",
    "src/iot_hardware_scanner/data/**/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external tools",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true