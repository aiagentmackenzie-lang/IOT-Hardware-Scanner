[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-hardware-scanner"
version = "1.0.0"
description = "Defensive firmware security analysis platform for IoT/embedded/OT devices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lead Security Engineer" },
]
keywords = ["iot", "firmware", "security", "scanner", "vulnerability", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "python-magic>=0.4",
    "rich>=13.0",
    "jinja2>=3.1",
    "yara-python>=4.5",
]

[project.optional-dependencies]
extraction = ["pybinwalk>=3.0"]
nvd = ["nvdlib>=0.7"]
sbom = ["cyclonedx-python-lib>=6.0"]
yaml_support = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
iot-hardware-scanner = "iot_hardware_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_hardware_scanner"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external tools",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true